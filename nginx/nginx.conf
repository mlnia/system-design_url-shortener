# Load balancer in front of the stateless web tier (book: "web servers behind a load balancer").
# Docker's DNS returns one A record per `app` replica; nginx round-robins across them.
upstream shortener_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16k;

    location / {
        proxy_pass http://shortener_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
