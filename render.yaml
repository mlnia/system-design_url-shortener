# Render Blueprint: Dashboard -> New -> Blueprint -> select this repo.
# Creates the web service (Docker), a managed Postgres and a Redis-compatible Key Value store.
services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: url-shortener-cache
          property: connectionString
      - key: MACHINE_ID
        value: auto
      - key: REDIRECT_STATUS_CODE
        value: "302"
      # Set BASE_URL to your custom domain once you have one, e.g. https://sho.rt

  - type: keyvalue
    name: url-shortener-cache
    plan: free
    maxmemoryPolicy: volatile-lru
    ipAllowList: []

databases:
  - name: url-shortener-db
    plan: free
